name: Function

# toxicity-alerts Azure Function (HU11):
#   PR   -> build + unit tests + coverage gate (>= 80%) + package
#   main -> same, then deploy to the Flex Consumption Function App (environment "dev", OIDC)
# Only runs when the function or this workflow changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/function.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/function.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-${{ github.ref }}
  cancel-in-progress: false

env:
  FUNCTION_DIR: functions/toxicity-alerts
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME || 'func-oc3d-dev-alerts' }}

jobs:
  build-test:
    name: Build & test function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.FUNCTION_DIR }}/pom.xml

      - name: Build, test, coverage gate and package
        run: ./mvnw -B -ntp -f "$FUNCTION_DIR/pom.xml" verify -DfunctionAppName="$FUNCTION_APP_NAME"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f "$FUNCTION_DIR/target/site/jacoco/jacoco.csv" ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          rows = list(csv.DictReader(open(os.environ["FUNCTION_DIR"] + "/target/site/jacoco/jacoco.csv")))
          missed = sum(int(r["LINE_MISSED"]) for r in rows)
          covered = sum(int(r["LINE_COVERED"]) for r in rows)
          print(f"### Function line coverage: {covered / (missed + covered):.1%} - gate: 80%")
          EOF
          fi

      - name: Upload function package
        uses: actions/upload-artifact@v7
        with:
          name: function-package
          path: ${{ env.FUNCTION_DIR }}/target/azure-functions/${{ env.FUNCTION_APP_NAME }}
          include-hidden-files: true
          retention-days: 7

  deploy-dev:
    name: Deploy function (dev)
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: function-package
          path: package

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The dev infrastructure is switched off between demos to save the student credit.
      - name: Check that the Function App exists
        id: target
        run: |
          if az functionapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$FUNCTION_APP_NAME" -o none 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Function App $FUNCTION_APP_NAME not found in ${{ vars.AZURE_RESOURCE_GROUP }}: deploy the infrastructure (oncontrol3d-infra, IaC workflow) first. Deployment skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (Flex Consumption)
        if: steps.target.outputs.exists == 'true'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: package
          sku: flexconsumption

      - name: Deployment summary
        if: steps.target.outputs.exists == 'true'
        run: |
          echo "### Function deployed: \`$FUNCTION_APP_NAME\` (${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
          az functionapp function list -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$FUNCTION_APP_NAME" \
            --query "[].name" -o tsv | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
