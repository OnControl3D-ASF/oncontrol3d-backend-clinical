spring.application.name=oncontrol-backend

# Microservicio
app.imaging-service.url=${IMAGING_SERVICE_URL:http://localhost:8001}

# Orthanc (PACS) — para subir DICOM desde la app
app.orthanc.url=${ORTHANC_URL:http://localhost:8042}

# Subida de DICOM (los estudios pesan decenas de MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Database Configuration (Uses ENV variables if present, otherwise local defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/OnControlSem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Server Configuration
server.port=${PORT:8081}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Using default Spring Boot naming strategy

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration=86400000

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Data Seeding Configuration
app.data.seeding.enabled=${APP_DATA_SEEDING_ENABLED:false}
app.data.seeding.password=${SEED_USER_PASSWORD:}

# Data Management Configuration
app.data.clean=false
app.data.migration.enabled=true
