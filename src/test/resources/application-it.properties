# Profile for integration + BDD tests (Testcontainers provides the DataSource).
# Demo data must never be loaded in tests: each scenario builds its own data.
app.data.seeding.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only signing key (not a real secret, never used outside tests).
authorization.jwt.secret=it-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz

# External services are not called by these tests.
app.imaging-service.url=http://localhost:9
app.orthanc.url=http://localhost:9
